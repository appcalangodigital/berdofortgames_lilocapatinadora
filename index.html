<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Liloca Games - Patinadora</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7eb6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liloca Games">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#3a2e5c;--pink:#ff7eb6;--mint:#7bdcb5;--sun:#ffd45e;--bg:#ffe9f3;--bz:clamp(60px,22vh,92px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);overflow:hidden;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 4px) calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 6px) calc(env(safe-area-inset-left,0px) + 8px)}
#top{display:flex;align-items:center;gap:6px;padding:0 4px 4px;flex:none}
.brand{font-weight:800;font-size:18px;background:linear-gradient(90deg,#ff5fa2,#ffb347,#4fd1a5);-webkit-background-clip:text;background-clip:text;color:transparent}
#tot{margin-left:auto;font-weight:800;font-size:16px;background:#fff;border-radius:999px;padding:2px 10px;border:3px solid var(--ink)}
#back,#snd,#vz,#who{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:19px;cursor:pointer;flex:none;padding:0}
#main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:6px}
#cl,#cr{flex:none;width:calc(var(--bz) + 8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#cl button,#cr button{width:var(--bz);height:var(--bz);border-radius:50%;border:4px solid var(--ink);background:var(--pink);font-size:calc(var(--bz)*.42);cursor:pointer;touch-action:none;padding:0}
#cl button:active,#cr button:active,#cl button.d,#cr button.d{transform:scale(.92);filter:brightness(1.1)}
#cl button.glow,#cr button.glow{box-shadow:0 0 0 6px #fff,0 0 28px 12px #ffd45e;transform:scale(1.08)}
#stage{position:relative;flex:none;width:600px}
#c{width:100%;height:auto;display:block;border-radius:18px;border:4px solid var(--ink);background:#6a4fb0}
.ov{position:absolute;inset:0;background:rgba(58,46,92,.85);display:flex;align-items:center;justify-content:center;border-radius:18px}
.ov[hidden]{display:none}
.card{background:#fff;border-radius:22px;border:4px solid var(--ink);padding:8px 12px;text-align:center;max-width:96%}
#inst{margin-top:6px;width:100%;border-radius:14px;border:3px solid var(--ink);background:var(--pink);color:#fff;font-weight:800;font-size:clamp(13px,3.4vh,18px);padding:5px 8px;cursor:pointer}
#inst[hidden]{display:none}
#intro{position:absolute;left:0;right:0;top:49%;display:flex;justify-content:center}
#intro[hidden]{display:none}
#play{border-radius:999px;border:4px solid var(--ink);background:var(--mint);color:var(--ink);font-weight:800;font-size:clamp(18px,6vh,30px);padding:6px 30px;cursor:pointer;animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#grid button,#rb button{border-radius:16px;border:4px solid var(--ink);background:var(--mint);cursor:pointer;font-size:clamp(20px,7vh,34px);padding:3px 4px;min-width:clamp(48px,11vw,84px);line-height:1.1}
#grid button small{display:block;font-size:12px;min-height:14px}
#grid button:disabled{background:#ddd;opacity:.6}
#rs{font-size:clamp(30px,10vh,54px);letter-spacing:4px}
#rb{display:flex;gap:10px;justify-content:center;margin-top:6px}
.ptitle{font-weight:800;font-size:clamp(16px,4.6vh,22px);margin-bottom:6px}
.chs{display:flex;gap:10px;justify-content:center}
.chb{border-radius:18px;border:4px solid var(--ink);background:#fff;padding:4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:clamp(13px,3.6vh,17px);color:var(--ink);font-family:inherit}
.chb.on{background:var(--sun)}
.chb canvas{width:clamp(64px,22vh,100px);height:auto;display:block}
#fin{position:absolute;right:8px;bottom:6px;display:flex;gap:8px}
#fin[hidden]{display:none}
#fin button{width:46px;height:46px;border-radius:50%;border:4px solid var(--ink);background:var(--mint);font-size:22px;cursor:pointer;padding:0}
#rot{display:none;position:fixed;inset:0;z-index:99;background:var(--pink);color:#fff;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:24px;text-align:center;gap:14px;padding:20px}
#rot span{font-size:84px;display:block;animation:rt 1.8s infinite}
@keyframes rt{0%,25%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
@media (max-height:520px){#back,#snd,#vz,#who{width:34px;height:34px;font-size:17px}}
</style>
</head>
<body>
<div id="app">
  <div id="top"><span class="brand">Liloca Games</span><span id="tot">⭐ 0</span><button id="vz">🗣</button><button id="snd">🔊</button><button id="who">👧</button><button id="back">🗺</button></div>
  <div id="main">
    <div id="cl"></div>
    <div id="stage">
      <canvas id="c" width="800" height="400"></canvas>
      <div id="map" class="ov"><div class="card"><div id="grid"></div><button id="inst">⬇️ Baixar o jogo</button></div></div>
      <div id="pick" class="ov" hidden><div class="card"><div class="ptitle">Escolha sua patinadora</div><div class="chs" id="chs"></div></div></div>
      <div id="intro" hidden><button id="play">▶ JOGAR</button></div>
      <div id="res" class="ov" hidden><div class="card"><div id="rs"></div><div id="rb"></div></div></div>
      <div id="fin" hidden></div>
    </div>
    <div id="cr"></div>
  </div>
</div>
<div id="rot"><span>📱</span><div>Gire o celular para jogar</div></div>
<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d'),W=800,H=400;
var PH=[['R',1],['T',2],['O',3],['L',4],['B',5],['E',6],['D',7],['M',8],['R',9,'t'],['R',10,'j']];
var ICON={R:'🏁',T:'🌀',O:'🚧',L:'⭐',B:'🎵',E:'⚖️',D:'🦘',M:'🧠'},LY=[272,302,332];
function ic(i){return i===8?'⏱':i===9?'🏆':ICON[PH[i][0]]}
var COL=['🔴','🔵','🟡'],BG=['#ff6b6b','#5aa9ff','#ffd45e'],FQ=[330,440,554];
var save={u:1,s:[]};try{var q=JSON.parse(localStorage.getItem('liloca_skate2'));if(q)save=q}catch(e){}
function persist(){try{localStorage.setItem('liloca_skate2',JSON.stringify(save))}catch(e){}}
var MUTE=false;try{MUTE=localStorage.getItem('liloca_mute')==='1'}catch(e){}
var AC=null;
function beep(f,d,t,v,s){if(MUTE)return;try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)()}
 if(AC.state==='suspended')AC.resume();var o=AC.createOscillator(),k=AC.createGain(),st=AC.currentTime+(s||0);
 o.type=t||'sine';o.frequency.value=f;k.gain.setValueAtTime(.0001,st);k.gain.linearRampToValueAtTime(v||.2,st+.02);
 k.gain.exponentialRampToValueAtTime(.0001,st+d);o.connect(k);k.connect(AC.destination);o.start(st);o.stop(st+d+.05)}catch(e){}}
function jingle(a){a.forEach(function(f,i){beep(f,.18,'triangle',.22,i*.11)})}
var S={k:'I',state:'intro',f:0};
var $=function(i){return document.getElementById(i)};

// Mapa
function total(){return save.s.reduce(function(a,b){return a+(b||0)},0)}
function buildMap(){
 var gr=$('grid');gr.innerHTML='';
 for(var i=0;i<10;i++){var b=document.createElement('button');var st=save.s[i]||0;
  b.disabled=i+1>save.u;b.innerHTML=(b.disabled?'🔒':ic(i))+'<small>'+(st?'⭐'.repeat(st):'')+'</small>';
  (function(n){b.onclick=function(){start(n)}})(i);gr.appendChild(b)}
 $('tot').textContent='⭐ '+total();$('map').hidden=false;$('res').hidden=true;S.state='map';$('fin').hidden=true;$('pick').hidden=true;clearCtl();try{speechSynthesis.cancel()}catch(e){}
}
$('back').onclick=buildMap;

// Controles
var onPress=function(){},HD={};
function clearCtl(){$('cl').innerHTML='';$('cr').innerHTML=''}
function setCtl(defs){clearCtl();var n=defs.length;
 defs.forEach(function(d,i){var b=document.createElement('button');b.textContent=d[0];if(d[1])b.style.background=d[1];
  b.addEventListener('pointerdown',function(e){e.preventDefault();b.classList.add('d');HD[i]=1;press(i)});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){b.addEventListener(ev,function(){b.classList.remove('d');HD[i]=0})});
  b.addEventListener('contextmenu',function(e){e.preventDefault()});$(n>1&&i===0?'cl':'cr').appendChild(b)})}
function press(i){if(S.state==='go')onPress(i)}
var KM={' ':0,ArrowUp:0,ArrowLeft:0,a:0,'1':0,s:1,ArrowDown:1,ArrowRight:1,'2':1,d:2,'3':2};
addEventListener('keydown',function(e){if(KM[e.key]!==undefined&&!e.repeat){e.preventDefault();HD[KM[e.key]]=1;press(KM[e.key])}});
addEventListener('keyup',function(e){if(KM[e.key]!==undefined)HD[KM[e.key]]=0});

// Fases
function start(i){
 HD={};var lv=i+1,k=PH[i][0],x=PH[i][2]||'',j;S={k:k,x:x,lv:lv,state:'talk',tk:0,cnt:180,f:0,g:0,hearts:3,spin:0};
 $('map').hidden=true;$('res').hidden=true;$('fin').hidden=true;$('pick').hidden=true;talk(S);
 if(k==='R'){S.px=0;S.v=0;S.rx=0;S.rv=x==='t'?0:x==='j'?4.2:3.2;S.len=2600;S.y=0;S.vy=0;S.inv=0;S.tm=780;
  if(x==='j'){S.obs=[];for(j=480;j<S.len-250;j+=300)S.obs.push({x:j});setCtl([['⛸','#7bdcb5']])}else setCtl([['⛸','#7bdcb5']]);
  onPress=function(a){if(a===0)S.v=Math.min(S.v+1.2,9.5);else if(S.y===0){S.vy=12;beep(520,.12,'square',.08)}}}
 if(k==='O'||k==='D'){S.dist=0;S.sp=k==='O'?4.2:4.6;S.len=2800;S.y=0;S.vy=0;S.inv=0;S.d=0;S.obs=[];
  for(j=500;j<S.len-300;j+=270+Math.random()*150){var hi=k==='D'&&Math.random()>.5;S.obs.push({x:j,hi:hi,t:hi?'🎈':k==='O'?'🚧':'🧊'})}
  setCtl(k==='O'?[['⬆','#ffd45e']]:[['⬆','#ffd45e'],['⬇','#9fd0ff']]);
  onPress=function(a){if(a===0&&S.y===0){S.vy=12;beep(520,.12,'square',.08)}}}
 if(k==='L'){S.dist=0;S.sp=4.2;S.len=2800;S.ln=1;S.ly=302;S.col=0;S.tot=0;S.inv=0;S.it=[];
  for(j=450;j<S.len-250;j+=150){var st=Math.random()<.6;if(st)S.tot++;S.it.push({x:j,l:Math.floor(Math.random()*3),s:st})}
  setCtl([['⬆','#ffd45e'],['⬇','#9fd0ff']]);onPress=function(a){S.ln=a===0?Math.max(0,S.ln-1):Math.min(2,S.ln+1);beep(600,.05,'sine',.08)}}
 if(k==='B'){S.bt=[];for(j=0;j<10;j++)S.bt.push({t:90+j*64,r:-1});S.sc=0;setCtl([['🎵','#ff7eb6']]);
  onPress=function(){var best=null,bd=99;S.bt.forEach(function(b){var d=Math.abs(S.g-b.t);if(b.r<0&&d<=24&&d<bd){bd=d;best=b}});
   if(best){best.r=bd<=9?2:1;S.sc+=best.r;S.spin=24;beep(best.r===2?880:660,.12,'triangle',.2)}else beep(150,.1,'sawtooth',.1)}}
 if(k==='E'){S.a=0;S.dir=Math.random()<.5?-1:1;S.tm=0;setCtl([['◀','#ffd45e'],['▶','#9fd0ff']]);onPress=function(a){var ls=Math.sign(S.a)||S.dir;if((a===0&&ls<0)||(a===1&&ls>0))S.a-=ls*.15}}
 if(k==='T'||k==='M'){S.rounds=k==='T'?3:4;S.n=k==='T'?2:3;S.mem=k==='M';S.round=0;S.shake=0;S.tlMax=k==='T'?200:S.n*70+110;
  newSeq();setCtl(COL.map(function(c,k){return[c,BG[k]]}));
  onPress=function(k){if(k>2||S.sh>0)return;if(S.seq[S.idx]===k){beep(FQ[k],.2,'triangle',.25);S.idx++;S.spin=30;
    if(S.idx===S.n){S.round++;if(S.round>=S.rounds)return end(true,S.hearts);S.state='pause';S.pz=45;jingle([523,659])}}else miss()}}
}
function newSeq(){S.seq=[];for(var i=0;i<S.n;i++)S.seq.push(Math.floor(Math.random()*3));S.idx=0;S.tl=S.tlMax;S.sh=S.mem?60+S.n*50:0}
function miss(){S.hearts--;S.shake=20;beep(160,.35,'sawtooth',.18);S.idx=0;S.tl=S.tlMax;if(S.hearts<=0)end(false,0)}
function end(win,st){
 if(S.state==='over')return;S.state='over';if(win){jingle([523,659,784,1047]);var o=save.s[S.lv-1]||0;save.s[S.lv-1]=Math.max(o,st);if(S.lv===save.u&&S.lv<10)save.u++;persist()}else beep(140,.6,'sawtooth',.2);
 if(win&&S.lv===10){$('tot').textContent='⭐ '+total();startFinale();return}
 say(win?(st===3?'Parabéns! Três estrelas!':'Muito bem!'):'Vamos tentar de novo!');$('rs').textContent=win?('⭐'.repeat(st)+'☆'.repeat(3-st)+(S.lv===10?'🏆':'')):'😢';
 var h='<button id="r1">🔄</button>';if(win&&S.lv<10)h='<button id="r2">▶</button>'+h;h+='<button id="r3">🗺</button>';
 $('rb').innerHTML=h;$('r1').onclick=function(){start(S.lv-1)};if($('r2'))$('r2').onclick=function(){start(S.lv)};$('r3').onclick=buildMap;
 $('tot').textContent='⭐ '+total();$('res').hidden=false;clearCtl();
}

function startFinale(){
 HD={};S={k:'F',state:'go',f:0,g:0,lv:10,hearts:0};
 $('map').hidden=true;$('res').hidden=true;$('pick').hidden=true;$('fin').hidden=true;clearCtl();
 $('fin').innerHTML='<button id="f1">🔄</button><button id="f2">🗺</button>';
 $('f1').onclick=startFinale;$('f2').onclick=buildMap;
}
function showPick(){
 clearCtl();S.state='map';$('map').hidden=true;$('res').hidden=true;$('fin').hidden=true;
 var c=$('chs');c.innerHTML='';
 CHS.forEach(function(ch,i){var b=document.createElement('button');b.className='chb'+(i===(save.ch||0)?' on':'');
  var cn=document.createElement('canvas');cn.width=90;cn.height=104;b.appendChild(cn);
  b.setAttribute('aria-label',ch.n);
  b.onclick=function(){save.ch=i;persist();applyCh();beep(660,.1,'triangle',.15);buildMap()};c.appendChild(b);
  var cx=cn.getContext('2d'),g0=g;g=cx;cx.scale(1.5,1.5);sk(30,64,1,ch.hair,ch.dress,0,0,0,0,ch);g=g0});
 $('pick').hidden=false;say('Escolha a sua patinadora!');
}
$('who').onclick=showPick;

// Desenho
function circ(x,y,r){g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);g.fill()}
function emo(t,x,y,s){g.font=s+'px serif';g.textAlign='center';g.fillText(t,x,y)}
function bg(c){
 var gr=g.createLinearGradient(0,0,0,190);gr.addColorStop(0,'#2b2160');gr.addColorStop(1,'#6a4fb0');g.fillStyle=gr;g.fillRect(0,0,W,190);
 var cc=['#ff8fb8','#ffd45e','#7bdcb5','#9fd0ff'],fc=['#ff5fa2','#ffd45e','#4fd1a5'],i;
 for(i=0;i<40;i++){g.fillStyle=cc[i%4];circ(((i*43-c*.2)%1720+1720)%1720-60,150+(i%3)*8,11)}
 for(i=0;i<14;i++){var fx=((i*130-c*.35)%1820+1820)%1820-60;g.fillStyle=fc[i%3];g.beginPath();g.moveTo(fx,40);g.lineTo(fx+36,40);g.lineTo(fx+18,76);g.fill()}
 var ic=g.createLinearGradient(0,190,0,H);ic.addColorStop(0,'#e8f8ff');ic.addColorStop(1,'#a8dcf5');g.fillStyle=ic;g.fillRect(0,190,W,H-190);
 g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;
 for(i=0;i<20;i++){var lx=((i*90-c)%1800+1800)%1800-60;g.beginPath();g.moveTo(lx,200);g.lineTo(lx-40,H);g.stroke()}
}
var CHS=[
 {n:'Branca',skin:'#fbd7b5',hair:'#f2c94c',dress:'#ff7eb6',sty:'b'},
 {n:'Indígena',skin:'#c68a5c',hair:'#1f1a24',dress:'#2fbf8f',sty:'i'},
 {n:'Negra',skin:'#7b4a2f',hair:'#1b1216',dress:'#9b6bff',sty:'n'}];
var RIV={skin:'#fbd7b5',sty:'b'},HAIR,DRESS,SKIN,STY;
function applyCh(){var c=CHS[save.ch||0]||CHS[0];HAIR=c.hair;DRESS=c.dress;SKIN=c.skin;STY=c.sty}
applyCh();
function sk(x,fy,dir,hair,dress,ph,rot,lift,flash,ch){
 if(flash&&Math.floor(S.f/5)%2)return;
 var skin=ch?ch.skin:SKIN,sty=ch?ch.sty:STY;
 g.save();g.translate(x,fy-27-lift);g.rotate(rot);g.scale(dir,1);var leg=Math.sin(ph)*6;
 g.fillStyle=hair;
 if(sty==='n'){circ(0,-20,15);circ(-13,-12,6);circ(13,-12,6)}else rr(-14,-24,28,sty==='i'?40:28,11);
 g.fillStyle=skin;g.fillRect(-7+leg,14,5,10);g.fillRect(3-leg,14,5,10);
 g.fillStyle='#fff';g.fillRect(-9+leg,23,10,4);g.fillRect(1-leg,23,10,4);
 g.fillStyle='#8a8a9a';g.fillRect(-10+leg,27,13,2);g.fillRect(0-leg,27,13,2);
 g.fillStyle=dress;g.beginPath();g.moveTo(-8,-2);g.lineTo(8,-2);g.lineTo(15,17);g.lineTo(-15,17);g.fill();
 g.fillStyle=skin;circ(0,-12,10);
 g.fillStyle=hair;g.beginPath();g.arc(0,-13,11,Math.PI*1.02,Math.PI*1.95);g.fill();
 if(sty==='i'){g.fillStyle='#e0452e';g.fillRect(-10.5,-18,21,3.5);g.fillStyle='#ffd45e';circ(-5,-16.2,1);circ(0,-16.2,1);circ(5,-16.2,1);
  var fc=['#e0452e','#2f9bff','#ffd45e'],fi;for(fi=0;fi<3;fi++){g.save();g.translate(0,-22);g.rotate((fi-1)*.45);g.fillStyle=fc[fi];g.beginPath();g.ellipse(0,-6,2.4,7,0,0,7);g.fill();g.restore()}}
 g.fillStyle='#3a2e5c';circ(4,-11,1.7);
 if(sty==='b'){g.fillStyle=dress;circ(-8,-20,4);circ(-2,-20,4)}
 else if(sty==='n'){g.fillStyle=dress;circ(7,-31,3.6);circ(14,-31,3.6);g.fillStyle='#fff';circ(10.5,-31,1.6)}
 g.restore();
}
var HINT={R:'Toque no botão verde ⛸ bem rápido!',t:'Corra contra o relógio!',T:'Repita as cores na mesma ordem!',O:'Toque no botão amarelo para pular!',L:'⬆ ⬇ troque de pista e pegue as ⭐',B:'Toque 🎵 quando o círculo encaixar!',E:'Toque ◀ ▶ para não cair!',D:'⬆ pule o gelo, ⬇ abaixe no balão',M:'Memorize as cores e repita!'};
var VOICE={R:'Toque no botão verde bem rápido para acelerar e chegar primeiro!',t:'Corra contra o relógio! Toque no botão verde bem rápido!',T:'Olhe as cores e toque nos botões das mesmas cores, na mesma ordem!',O:'Toque no botão amarelo para pular as barreiras!',L:'Toque no botão amarelo para subir e no azul para descer. Pegue as estrelas e fuja do gelo!',B:'Toque no botão rosa quando o círculo encaixar, no ritmo da música!',E:'Toque nos botões amarelo e azul para a patinadora não cair! Aperte o que está brilhando.',D:'O botão amarelo pula o gelo. O botão azul abaixa embaixo do balão!',M:'Memorize as cores. Elas vão sumir. Depois toque nos botões na mesma ordem!'};
function pickVoice(){try{var l=speechSynthesis.getVoices().filter(function(v){return /^pt/i.test(v.lang)});if(!l.length)return null;
